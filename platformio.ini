[env:seeed_wio_terminal]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino

lib_deps = 
    adafruit/Adafruit Unified Sensor@^1.1.15
    adafruit/Adafruit BMP280 Library@^3.0.0
    seeed-studio/Seeed Arduino FS@^2.1.3
    seeed-studio/Seeed_Arduino_LCD@^1.6.0
